<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>تسجيل الدخول | دلتا</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="alternate icon" href="assets/favicon.ico" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="دلتا" />
    <meta name="msapplication-TileColor" content="#FFFFFF" />
    <meta name="msapplication-TileImage" content="assets/icon-192.png" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth-page">
    <div class="page-shell">
      <header
        class="topbar"
        data-topbar
        data-variant="auth"
      ></header>

      <main class="auth-layout">
        <aside class="auth-art" aria-hidden="true">
          <img class="auth-art-logo" src="assets/favicon.svg" alt="" width="56" height="56" />
          <p class="auth-art-title">الرياضيات والعلوم من حياتك</p>
          <p class="auth-art-sub">منصة تعليمية بالذكاء الاصطناعي للصفوف من الأول للتاسع.</p>
          <ul class="auth-points">
            <li><i data-lucide="check"></i> تحديات من حياتك لكل درس</li>
            <li><i data-lucide="check"></i> تقييم فوري وملاحظات واضحة</li>
            <li><i data-lucide="check"></i> تلميحات بدون ما يعطيك الحل</li>
          </ul>
        </aside>
        <div class="glass-card auth-card">
          <h1>أهلاً بعودتك</h1>
          <p>سجّل دخولك لتكمل رحلتك مع دلتا.</p>

          <form id="loginForm" class="auth-form" novalidate>
            <label>
              البريد الإلكتروني
              <input type="email" id="email" placeholder="example@email.com" required />
            </label>
            <label>
              كلمة المرور
              <input type="password" id="password" placeholder="********" required />
            </label>
            <button type="submit" class="primary-btn full-width">تسجيل الدخول</button>
          </form>

          <div class="auth-divider"><span>أو</span></div>

          <button type="button" id="googleSignInBtn" class="secondary-btn full-width google-btn">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.81 2.73v2.27h2.92c1.71-1.57 2.69-3.88 2.69-6.64z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.44 15.98 5.48 18 9 18z"/>
              <path fill="#FBBC05" d="M3.97 10.7A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.29-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l3.01-2.33z"/>
              <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.97l3.01 2.33C4.68 5.17 6.66 3.58 9 3.58z"/>
            </svg>
            <span>المتابعة عبر جوجل</span>
          </button>

          <p class="auth-link">
            ما عندك حساب؟ <a href="signup.html">أنشئ حساب جديد</a>
          </p>
        </div>
      </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/delta-character.js"></script>
    <script src="js/components.js"></script>
    <script type="module">
      import { auth } from './js/firebase.js';
      import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
      // Only redirect someone who was ALREADY signed in when the page opened.
      // After a fresh login, js/auth.js decides where to go (admins go to the
      // admin panel) — redirecting here too used to race it and send admins
      // to the dashboard.
      let firstAuthCheck = true;
      onAuthStateChanged(auth, (user) => {
        if (firstAuthCheck && user) window.location.replace('dashboard.html');
        firstAuthCheck = false;
      });
    </script>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
