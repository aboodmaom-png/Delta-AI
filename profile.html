<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>الملف الشخصي | دلتا</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="alternate icon" href="assets/favicon.ico" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta name="theme-color" content="#FFF9F1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="دلتا" />
    <meta name="msapplication-TileColor" content="#FFF9F1" />
    <meta name="msapplication-TileImage" content="assets/icon-192.png" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <div class="page-load-overlay" id="profileLoadOverlay">
      <div class="page-load-mascot" data-mascot></div>
      <p class="page-load-text">دلتا يفتح ملفك...</p>
    </div>
    <div class="page-shell profile-page">
      <header class="topbar" data-topbar data-active="profile"></header>

      <main class="profile-layout">
        <section class="profile-hero glass-card">
          <div class="avatar-ring">
            <div class="avatar-large" id="profileAvatar">ع</div>
          </div>
          <div class="profile-info">
            <p class="section-tag">ملفّي</p>
            <h2 id="profileName">—</h2>
            <p class="profile-grade" id="profileGrade">—
              <button type="button" id="editGradeBtn" class="edit-grade-btn">تعديل</button>
            </p>
            <p class="profile-bio" id="profileEmail">—</p>
          </div>
        </section>

        <section class="xp-card glass-card">
          <div class="xp-top">
            <div>
              <p class="section-tag">مستواك</p>
              <h3 id="profileLevel">المستوى —</h3>
              <p class="total-xp-tag">المجموع <bdi dir="ltr" id="profileTotalXp">— XP</bdi></p>
            </div>
            <div class="xp-pill" id="profileXpPill">— من 1000</div>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="profileProgressFill"></div>
          </div>
          <p class="xp-caption">كل تحدي بتحلّه بيقرّبك من المستوى الجاي.</p>
        </section>

        <section class="stats-grid profile-stats">
          <article class="stat-card glass-card">
            <p class="stat-label">التحديات المكتملة</p>
            <h4 id="profileChallenges">—</h4>
          </article>
          <article class="stat-card glass-card">
            <p class="stat-label">متوسط درجاتك</p>
            <h4 id="profileAvgScore">—</h4>
          </article>
        </section>

        <section class="glass-card challenges-card">
          <div class="section-heading">
            <h3>التحديات الأخيرة</h3>
          </div>
          <div class="challenge-list" id="recentChallengesList">
            <p class="empty-message">جاري التحميل...</p>
          </div>
        </section>

        <button type="button" class="secondary-btn full-width logout-wide" id="profileLogoutBtn">
          تسجيل الخروج
        </button>

        <nav class="profile-links" aria-label="معلومات">
          <a href="about.html">عن دلتا</a>
          <span aria-hidden="true">·</span>
          <a href="privacy.html">سياسة الخصوصية</a>
        </nav>
      </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/delta-character.js"></script>
    <script src="js/components.js"></script>
    <script type="module" src="js/profile.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.lucide) window.lucide.createIcons();
      });
    </script>
  </body>
</html>
